version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ThisIsTheRootPassword
    command: >
      bash -c "
        mkdir -p /data/db && chown -R mongodb:mongodb /data/db &&
        exec mongod --replSet rs0 --bind_ip_all
      "
    volumes:
      - mongodb_data:/data/db

  mongo-init-replica:
    image: mongo:6.0
    depends_on:
      - mongodb
    entrypoint:
      - bash
      - -c
      - |
        sleep 5
        echo '🔁 Starting replica set...'
        mongosh --host localhost:27017 -u root -p ThisIsTheRootPassword --authenticationDatabase admin --eval '
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "localhost:27017" }
            ]
          })
        '

volumes:
  mongodb_data:
